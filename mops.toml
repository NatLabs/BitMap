[package]
name = "bit-map"
version = "0.1.2"
description = "A data structure for fast set operations on a set of integers each represented by a bit."
repository = "https://github.com/NatLabs/BitMap"
keywords = ["set", "bitmap", "data-structure"]
license = "MIT"

[dependencies]
base = "0.16.0"
map = "9.0.1"
itertools = "0.2.2"
vector = "0.4.2"

[dev-dependencies]
test = "2.1.1"
bench = "1.0.0"
fuzz = "1.0.0"
augmented-btrees = "0.7.1"

[toolchain]
moc = "0.16.0"
